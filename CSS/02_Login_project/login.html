<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #141313;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #868383;
            border-radius: 5px;
            padding: 30px;
            width: 300px;
        }

        h2 {
            color: #2510ad;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 3px;
            background-color: #f1ebeb;
            border: none;
            width: 263px;
        }

        button {
            display: flex;
            background-color: #0a205c;
            color: #ffff;
            padding: 8px;
            border-radius: 3px;
            border: none;
            width: 280px;
        }

        button:hover {

            background-color: #4162be;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Login</h2>
        <input type="email" name="" id="" placeholder="Enter Email">
        <input type="password" name="" id="" placeholder="Enter Password">
        <br>
        <button type="submit">Login</button>
    </div>
</body>

</html>
