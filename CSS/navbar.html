<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        color: white;
    }

    .nav-container {
        margin-bottom: 40px;
    }

    h2 {
        margin-bottom: 20px;
    }

    .nav1 {
        background-color: #ffffff;
        padding: 5px;
    }

    .nav1 ul {
        padding: 0;
        margin: 0;
        list-style-type: none;
        display: flex;
        justify-content: space-around;
    }

    .nav1 li {
        display: inline;
        margin-top: 14px;
        margin-bottom: 8px;
    }

    .nav1 a {
        text-decoration: none;
        color: #242222;
        background-color: #f9e0ce;
        padding: 2px 10px;
        position: relative;
    }

    .nav1 a::before {
        content: "";
        position: absolute;
        height: 2px;
        width: 100%;
        bottom: 0;
        left: 0;
        background-color: #437fd9;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
    }

    .nav1 a:hover::before {
        transform: scaleX(1);
    }

    .nav1 .login-btn {
        background-color: #325be0;
        color: white;
        border: none;
        padding: 5px 15px;
        border-radius: 4px;
        cursor: pointer;
    }

    .nav2 {
        background-color: #8c5e5e;
        width: 200px;
        padding: 20px;
    }

    .nav2 ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
    }

    .nav2 li {
        margin-bottom: 10px;
    }

    .nav2 a {
        text-decoration: none;
        color: #ffff;
        display: block;
        padding: 10px;
        width: 100%;
        margin: 0;


    }

    .nav2 .login-btn {
        background-color: #5e939e;
        color: white;
        border: none;
        border-radius: 4px;
        width: 100%;
        cursor: pointer;
        padding: 10px;
    }

    .nav2 .login-btn:hover {
        background-color: #4f554c;
        border: 0.5px solid white;
    }

    .nav2 a:hover {
        background-color: #760b0b;
    }

    .nav3 {
        background-color: #4c47a0;
        padding: 10px;
    }

    .nav3 ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    .nav3 a {
        text-decoration: none;
        color: #d5d9eb;
        padding: 10px;
        display: block;
    }

    .nav3 .dropdown-content {
        display: none;
    }

    .nav3 .dropdown:hover .dropdown-content {
        display: block;
        position: absolute;
        background-color: #ad30da;
        min-width: 100px;
    }

    .nav3 .dropdown:hover .dropdown-content a:hover {
        background-color: #2c0529;
    }

    .nav3 .login-btn {
        border: 1px solid black;
        border-radius: 4px;
        padding: 5px;
        background-color: #9e1717;
        color: #f9f8f8
    }

    .nav3 .login-btn:hover {
        opacity: 0.9;
    }
</style>

<body>
    <div class="nav-container">
        <h2>Variation 1: Horizontal with underline effect.</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation 2: Vertical with Hover effect.</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
            </ul>
            <button class="login-btn">Login</button>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation 3: Horizontal with Dropdown.</h2>
        <nav class="nav3">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="dropdown">
                    <a href="#">About</a>
                    <div class="dropdown-content">
                        <a href="#">Our Story</a>
                        <a href="#">Team</a>
                        <a href="#">Contact</a>
                    </div>
                </li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
</body>

</html>
