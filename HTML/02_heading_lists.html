<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <p>Lorem ipsum <em>dolor</em> sit amet <strong>consectetur</strong> adipisicing.</p>
    <h1>Lorem, ipsum dolor.</h1>
    <h2>Lorem ipsum dolor sit amet consectetur.</h2>
    <ol>
        <li>Orange Tea</li>
        <li>Black Tea</li>
    </ol>

    <img src="./HTML/images/abc.png" width="200px" alt="">
    <div>
        <h1>Block Level Elements</h1>
        <ul>
            <li>Headings H1 to H6</li>
            <li>ol,li</li>
            <li>li</li>
            <li>p</li>
        </ul>

    </div>
    <div>
        <h1>Inline Elements</h1>
        <ul>
            <li>a tag</li>
            <li>img</li>
            <li>strong</li>
            <li>em</li>
        </ul>
    </div>
</body>

</html>
