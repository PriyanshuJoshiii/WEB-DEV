<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <div>
        <form>
            <h1>LOGIN PAGE</h1>
            <label for="name">Name:
                <input type="text" name="Name" id="0">
            </label>
            <label  for="Email">
                EMail:
                <input placeholder=" Enter your email" type="email" name="Email" id="1">
                <button type="submit">KR DO</button>
            </label>
            <label for="Password">
                <input type="password" name="Password" id="">
                <button type="submit">SUBMIT HERE</button>
            </label>
            <h2>GAME SELECTION</h2>
            <label for="GAME">
                BASKETBALL:
                <input type="checkbox" name="BASKETBALL" id="">
            </label>
            <label for="GAMES">
                Games:
                <select name="GAMES" id="">
                    <option value="default"></option>
                    <option value="CRICKET">CRICKET</option>
                    <option value="HOCKEY">HOCKEY</option>
                    <option value="LUDO" title="HELLO">LUDO</option>
                </select>
            </label>
            <h3>PERSONAL INFO</h3>
            <label for="YOURSELF">
                MALE:
                <input type="radio" name="GENDER" id="">

                FEMALE:
                <input type="radio" name="GENDER" id="">
               OTHER:
                <input type="radio" name="GENDER" id="">
            </label>
            <label for="Month">
                <select name="DOB" id="">
                    <option value="default"></option>
                    <input type="month" name="" id="">
                </select>
            </label>

        </form>
    </div>
</body>
</html>
